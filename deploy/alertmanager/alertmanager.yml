# PlayArena Alertmanager — human notification path (PHI-1B).
#
# Pilot choice: a single Slack incoming webhook (free, instant, no PagerDuty
# cost or on-call rotation to manage for a one-weekend pilot). Email is wired as
# a secondary path. Critical alerts notify immediately; warnings are grouped and
# throttled. Replace the placeholder webhook/SMTP values (keep them out of git —
# Alertmanager has no env substitution, so mount this file as a secret or use a
# secrets-injected copy).

global:
  resolve_timeout: 5m
  # smtp_smarthost: 'smtp.resend.com:587'
  # smtp_from: 'alerts@playarena.app'
  # smtp_auth_username: 'resend'
  # smtp_auth_password: '__RESEND_API_KEY__'

route:
  receiver: slack-default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: slack-critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: slack-default
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/__REPLACE_ME__'
        channel: '#playarena-alerts'
        send_resolved: true
        title: '{{ .CommonLabels.severity | toUpper }}: {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          — {{ .Annotations.description }}
          {{ end }}

  - name: slack-critical
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/__REPLACE_ME__'
        channel: '#playarena-alerts'
        send_resolved: true
        title: '🔴 CRITICAL: {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          — {{ .Annotations.description }}
          {{ end }}
    # Secondary path — uncomment after configuring SMTP above.
    # email_configs:
    #   - to: 'oncall@playarena.app'
    #     send_resolved: true
