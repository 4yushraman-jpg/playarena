# PlayArena — production deployment (PHI-1A).
#
# Topology:  Cloudflare (TLS edge + CDN + WAF)  →  Caddy (origin TLS, reverse
# proxy)  →  { web (Next.js), api (Go) }.  Postgres is a MANAGED service (Neon /
# Supabase / RDS) referenced by DATABASE_URL — it is NOT a service here.  The
# internal observability port (9090) is never published; Prometheus scrapes it
# over the private network (optional `observability` profile).
#
# Usage:
#   cp ../backend/.env.production.example ../backend/.env.production   # fill it
#   export DATABASE_URL=...            # for the one-shot migrate step
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Build arg for the web image (NEXT_PUBLIC_API_URL is baked at build time):
#   NEXT_PUBLIC_API_URL=https://api.playarena.app docker compose -f ... build web

networks:
  playarena:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16   # matches TRUSTED_PROXY_CIDRS in .env.production

volumes:
  caddy_data:
  caddy_config:
  uploads_data:
  prometheus_data:
  grafana_data:

services:
  # One-shot schema migration against the managed database. Run before `up`.
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["migrate"]
    networks: [playarena]
    volumes:
      - ../backend/db/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -c
      - 'migrate -path=/migrations -database="$$DATABASE_URL" up'
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in your shell or deploy/.env}
    restart: "no"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: playarena-api:latest
    networks: [playarena]
    env_file:
      - ../backend/.env.production
    # No published ports: only Caddy (same network) reaches it. 9090 stays private.
    expose:
      - "8080"
      - "9090"
    volumes:
      - uploads_data:/app/uploads        # only used when STORAGE_BACKEND=local
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.playarena.app}
    image: playarena-web:latest
    networks: [playarena]
    expose:
      - "3000"
    restart: always

  caddy:
    image: caddy:2.8-alpine
    networks: [playarena]
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro              # Cloudflare Origin Certificate (origin.pem/.key)
      - caddy_data:/data
      - caddy_config:/config
    restart: always

  # ── Optional observability (docker compose --profile observability up) ────────
  prometheus:
    image: prom/prometheus:v3.0.0
    profiles: ["observability"]
    networks: [playarena]
    depends_on: [api]
    volumes:
      - ../backend/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../backend/deploy/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    networks: [playarena]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    restart: always

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    networks: [playarena]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a Grafana admin password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../backend/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../backend/deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: always
